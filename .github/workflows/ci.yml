name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore GestionRequerimientoDP.slnx
      - run: dotnet build GestionRequerimientoDP.slnx --no-restore -c Release
      - run: dotnet test GestionRequerimientoDP.slnx --no-build -c Release --verbosity normal
